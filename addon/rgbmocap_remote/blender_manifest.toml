schema_version = "1.0.0"
id = "rgbmocap_remote"
version = "0.1.0"
name = "RGBMoCap Remote"
tagline = "Reconstruct video on a LAN server and import animated rigs"
maintainer = "RGBMoCap Remote contributors"
type = "add-on"
blender_version_min = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]
tags = ["Animation", "Import-Export"]

[permissions]
network = "Submit videos to the configured server and download motion"
files = "Read selected videos and cache downloaded FBX animations"
[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
